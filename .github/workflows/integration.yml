# Integration tests ON DEMAND (course recommendation: too slow to run on every PR by default).
# Runs when a PR carries the `run-integration` label (on labelling and on every later push), or by
# hand: Actions → Integration → Run workflow (any branch). Not a required check; required when the
# diff touches a route, page or migration — see AGENTS.md › Testing and CODE_REVIEW.md.
# Kept out of ci.yml on purpose: a `labeled` trigger there would restart and cancel the whole CI
# every time the pipeline adds a label.
name: Integration

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  integration:
    name: Integration (testcontainers + agent-browser)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-integration') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-integration'))
    concurrency:
      group: integration-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: agent-browser version
        id: agent-browser
        run: echo "version=$(node -p 'require("./node_modules/agent-browser/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache agent-browser Chrome
        uses: actions/cache@v6
        with:
          path: ~/.agent-browser/browsers
          key: agent-browser-chrome-${{ runner.os }}-${{ steps.agent-browser.outputs.version }}
      - name: Install the agent-browser Chrome and its system libraries
        run: pnpm exec agent-browser install --with-deps
      - run: make test-integration
      - name: Integration summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "tests/integration/.evidence/results.json";
            const out = ["### Integration tests (testcontainers + agent-browser)"];
            if (!fs.existsSync(file)) { out.push("", "No results file — the suite did not reach the tests (see the job log and the evidence artifact)."); }
            else {
              const r = JSON.parse(fs.readFileSync(file, "utf8"));
              out.push("", `**${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} skipped** of ${r.numTotalTests}`, "", "| File | Passed | Failed | Skipped |", "|---|---|---|---|");
              for (const t of r.testResults) {
                const c = (s) => t.assertionResults.filter((a) => a.status === s).length;
                out.push(`| ${t.name.split("tests/integration/")[1] ?? t.name} | ${c("passed")} | ${c("failed")} | ${c("pending") + c("skipped")} |`);
              }
              const failed = r.testResults.flatMap((t) => t.assertionResults.filter((a) => a.status === "failed").map((a) => a.fullName));
              if (failed.length) out.push("", "**Failed:**", ...failed.map((f) => `- ${f}`));
            }
            out.push("", "Screenshots, server logs and reports: artifact `integration-evidence-${{ github.run_id }}` (Summary page of this run).");
            console.log(out.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence-${{ github.run_id }}
          path: tests/integration/.evidence/
          retention-days: 14
          # Same name across re-run attempts (run_id is stable) — overwrite instead of failing the check.
          overwrite: true
          # .evidence is a dot-folder: upload-artifact skips hidden files unless told otherwise.
          include-hidden-files: true
          # Missing evidence is a failure, not a warning — a green job without proof proves nothing.
          if-no-files-found: error
